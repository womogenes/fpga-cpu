adapter speed 1000
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -ndata 0x0010

transport select jtag
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5
target create $_CHIPNAME.cpu riscv -chain-position $_CHIPNAME.cpu -coreid 0

init
halt
echo "Ready for CPU-only reset"
