image sdcard.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition "OpenSBI with u-boot as payload" {
        partition-type-uuid = "aaa01589-8cd3-5f10-8785-832ffbc41d64"
        image = "fw_payload.bin"
        offset = 1M
        size = 4M
    }

    partition "FIT image" {
        partition-type-uuid = "linux"
        image = "boot.vfat"
        offset = 5M
    }

    partition "rootfs" {
        partition-type-uuid = "linux"
        image = "rootfs.ext4"
        offset = 37M
    }

    partition "models" {
        partition-type-uuid = "linux"
        image = "models.ext4"
        offset = 677M
    }
}

image boot.vfat {
    vfat {
        file "fitImage.itb" {
            image = "fitImage.itb"
        }
    }
    size = 32M
}
